{% extends 'base.html' %}
{% block title %}Login · Secure IT Helpdesk{% endblock %}
{% block content %}
<section class="auth-card panel"><p class="eyebrow">Secure portal</p><h1>Welcome back</h1><p class="muted">Sign in to manage IT support tickets.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="form-field"><label>Username</label>{{ form.username }}</div><div class="form-field"><label>Password</label>{{ form.password }}</div><button class="button primary full">Login</button></form><p class="muted auth-note">Need an account? <a href="{% url 'register' %}">Register</a></p></section>
{% endblock %}
