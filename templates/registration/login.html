{% extends 'base.html' %}
{% block title %}Login · Secure IT Helpdesk{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold text-green">Welcome back</h1>
      <p class="text-muted">Sign in to manage IT support tickets.</p>
      <form method="post">{% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
        <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
        <button class="btn btn-green w-100">Login</button>
      </form>
      <p class="mt-3 mb-0 small">Need an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
