{% extends 'base.html' %}
{% block content %}
<section class="form-shell panel">
  <p class="eyebrow">Support management</p><h1>Manage ticket</h1><p class="muted">{{ ticket.title }}</p>
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>{% endfor %}
    <div class="actions"><button class="button primary">Save Changes</button><a class="button outline" href="{% url 'ticket_detail' ticket.pk %}">Back</a></div>
  </form>
</section>
{% endblock %}
