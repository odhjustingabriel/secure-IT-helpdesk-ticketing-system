<form class="panel filter-panel" method="get">
  <div class="form-field"><label>Search</label><input class="form-input" name="q" value="{{ request.GET.q }}" placeholder="Title or description"></div>
  <div class="form-field"><label>Status</label><select class="form-input" name="status"><option value="">All</option>{% for value,label in status_choices %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="form-field"><label>Priority</label><select class="form-input" name="priority"><option value="">All</option>{% for value,label in priority_choices %}<option value="{{ value }}" {% if request.GET.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="form-field"><label>Category</label><select class="form-input" name="category"><option value="">All</option>{% for category in categories %}<option value="{{ category.id }}" {% if request.GET.category == category.id|stringformat:'s' %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div>
  {% if is_staff_role %}<div class="form-field"><label>Assigned</label><select class="form-input" name="assigned_to"><option value="">All</option><option value="unassigned" {% if request.GET.assigned_to == 'unassigned' %}selected{% endif %}>Unassigned</option>{% for staff in support_users %}<option value="{{ staff.id }}" {% if request.GET.assigned_to == staff.id|stringformat:'s' %}selected{% endif %}>{{ staff.username }}</option>{% endfor %}</select></div>{% endif %}
  <button class="button primary">Filter</button>
</form>
